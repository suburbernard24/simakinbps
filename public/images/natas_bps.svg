<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 80" width="420" height="80" fill="none">
    <defs>
        <linearGradient id="bpsBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#0B4F82"/>
            <stop offset="100%" stop-color="#042F54"/>
        </linearGradient>
        <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#0284C7"/>
            <stop offset="100%" stop-color="#0EA5E9"/>
        </linearGradient>
        <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#F59E0B"/>
            <stop offset="100%" stop-color="#D97706"/>
        </linearGradient>
        <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#10B981"/>
            <stop offset="100%" stop-color="#059669"/>
        </linearGradient>
    </defs>

    <!-- Emblem Group -->
    <g transform="translate(10, 8)">
        <!-- Rounded Background Container -->
        <rect x="0" y="0" width="64" height="64" rx="16" fill="#F0F6FA" stroke="#DCE8F2" stroke-width="1.5"/>
        
        <!-- Stylized BPS Data Pillars / Ribbon Icon -->
        <!-- Left Pillar (Orange/Amber) -->
        <rect x="15" y="32" width="8" height="18" rx="3" fill="url(#amberGrad)"/>
        <!-- Center Pillar (Green/Emerald) -->
        <rect x="27" y="24" width="8" height="26" rx="3" fill="url(#emeraldGrad)"/>
        <!-- Right Pillar (Teal/Sky) -->
        <rect x="39" y="16" width="8" height="34" rx="3" fill="url(#tealGrad)"/>
        <!-- Top Arch Diamond (BPS Navy) -->
        <path d="M 17 25 L 31 13 L 45 25" stroke="url(#bpsBlueGrad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        <circle cx="31" cy="13" r="3" fill="#0B4F82"/>
    </g>

    <!-- Typography Group -->
    <g transform="translate(86, 0)">
        <!-- "NATAS" Title -->
        <text x="0" y="34" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="900" font-size="28" fill="#0B4F82" letter-spacing="-0.5">NATAS</text>
        
        <!-- "BPS" Badge -->
        <rect x="104" y="15" width="48" height="21" rx="6" fill="#0B4F82"/>
        <text x="128" y="30" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="800" font-size="12" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">BPS</text>
        
        <!-- "MANGGARAI" Location -->
        <text x="160" y="31" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="800" font-size="16" fill="#1E293B" letter-spacing="1">MANGGARAI</text>
        
        <!-- Subtitle / Full Expansion -->
        <text x="0" y="52" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="600" font-size="11" fill="#475569" letter-spacing="0.2">Navigasi Akses Terpadu Layanan Statistik</text>
        
        <!-- Micro Tagline -->
        <text x="0" y="66" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="500" font-size="9.5" fill="#0284C7" letter-spacing="0.3">Satu Ruang, Beragam Layanan Statistik.</text>
    </g>
</svg>

